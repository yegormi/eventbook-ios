info:
  title: EventBook API
  description: REST API for EventBook
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://api.eventbook.pp.ua
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UserDto:
      type: object
      properties:
        id:
          type: string
          example: 66c6fab4f13bf5134c167e8b
          description: The id of the user
        email:
          type: string
          example: johndoe@example.com
          format: email
          description: The email of the user
          nullable: true
        fullName:
          type: string
          example: John Doe
          description: The full name of the user
          nullable: true
        phoneNumber:
          type: string
          example: '+1234567890'
          description: The phone number of the user
          nullable: true
        avatar:
          type: string
          example: https://example.com/avatar.jpg
          description: The avatar URL of the user
          nullable: true
      required:
        - id
        - email
        - fullName
        - phoneNumber
        - avatar
    ApiErrorDto:
      type: object
      properties:
        code:
          type: string
          description: The error code
          example: entity-not-found
          enum:
            - internal
            - unauthorized
            - entity-not-found
            - email-not-unique
            - entity-not-unique
        message:
          type: string
          description: A human-readable message describing the error
          example: Entity not found
        details:
          type: object
          description: Additional details about the error
          example:
            entity: User
      required:
        - message
    UpdateUserDto:
      type: object
      properties:
        fullName:
          type: string
          example: John Doe
          description: The full name of the user
          nullable: true
    Icon:
      type: string
      enum:
        - party
        - disco
        - competition
        - festival
        - conference
        - workshop
        - meeting
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        icon:
          $ref: '#/components/schemas/Icon'
        description:
          type: string
      required:
        - name
        - slug
        - icon
        - description
    CategoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        icon:
          $ref: '#/components/schemas/Icon'
        description:
          type: string
      required:
        - id
        - name
        - slug
        - icon
        - description
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        icon:
          $ref: '#/components/schemas/Icon'
        description:
          type: string
    EventDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        date:
          format: date-time
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        author:
          $ref: '#/components/schemas/UserDto'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
      required:
        - id
        - name
        - description
        - price
        - date
        - address
        - lat
        - lng
        - author
        - categories
    TicketDto:
      type: object
      properties:
        id:
          type: string
          description: The ID of the ticket
          example: 123e4567-e89b-12d3-a456-426614174000
        event:
          description: The event of the ticket
          allOf:
            - $ref: '#/components/schemas/EventDto'
        owner:
          description: The owner of the ticket
          allOf:
            - $ref: '#/components/schemas/UserDto'
        createdAt:
          format: date-time
          type: string
          description: The created at date of the ticket
          example: '2021-01-01T00:00:00.000Z'
      required:
        - id
        - event
        - owner
        - createdAt
    GetTicketsResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TicketDto'
        total:
          type: integer
        limit:
          type: integer
        pagesCount:
          type: integer
      required:
        - data
        - total
        - limit
        - pagesCount
    CreateEventDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        date:
          format: date-time
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        categories:
          description: Category slugs
          type: array
          items:
            type: string
      required:
        - name
        - description
        - price
        - date
        - address
        - lat
        - lng
        - categories
    GetEventsResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
        total:
          type: integer
        limit:
          type: integer
        pagesCount:
          type: integer
      required:
        - data
        - total
        - limit
        - pagesCount
    AutocompleteEventRequestDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
    AutocompleteEventResponseDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
    UpdateEventDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        date:
          format: date-time
          type: string
        lat:
          type: number
        lng:
          type: number
        categories:
          description: Category slugs
          type: array
          items:
            type: string
      required:
        - categories
    CreateReviewDto:
      type: object
      properties:
        title:
